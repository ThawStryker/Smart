<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mose Engine Debug</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  .header { padding: 8px 16px; background: #111; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header h1 { font-size: 14px; color: #888; }
  .header .status { font-size: 11px; color: #666; }

  .main { flex: 1; display: flex; overflow: hidden; }
  .panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #222; overflow: hidden; min-width: 0; }
  .panel.doc { flex: 1.25; }
  .panel:last-child { border-right: none; }
  .panel-header { padding: 6px 12px; background: #151515; border-bottom: 1px solid #222; font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
  .panel-header .path { text-transform: none; font-weight: 400; color: #22c55e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel-body { flex: 1; overflow: auto; padding: 8px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.5; }
  .panel-body.output, .panel-body.doc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.65; padding: 16px 18px; }

  .input-bar { padding: 8px 16px; background: #111; border-top: 1px solid #333; display: flex; gap: 8px; flex-shrink: 0; }
  .input-bar input { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; color: #e0e0e0; font-size: 13px; outline: none; }
  .input-bar input:focus { border-color: #555; }
  .input-bar button { background: #2563eb; color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .input-bar button:hover { background: #1d4ed8; }
  .input-bar button:disabled { background: #333; color: #666; cursor: not-allowed; }

  .event { margin-bottom: 4px; padding: 4px 8px; border-radius: 4px; border-left: 3px solid transparent; }
  .event-phase { border-left-color: #eab308; background: #1a1700; }
  .event-delta-text { border-left-color: #06b6d4; background: #001a1a; }
  .event-delta-thinking { border-left-color: #8b5cf6; background: #1a0033; }
  .event-delta-write { border-left-color: #22c55e; background: #001a00; }
  .event-done { border-left-color: #22c55e; background: #001a00; color: #22c55e; }
  .event-error { border-left-color: #ef4444; background: #1a0000; color: #ef4444; }
  .event-user { border-left-color: #3b82f6; background: #001033; }
  .event-system { border-left-color: #6b7280; background: #111; color: #888; }
  .event-type { font-weight: 600; margin-right: 8px; }
  .event-content { white-space: pre-wrap; word-break: break-all; margin-top: 4px; }

  .panel-body.output { font-size: 13.5px; line-height: 1.5; padding: 12px 18px; }

  .doc-empty { color: #666; font-style: italic; font-size: 13px; }

  .step { padding: 4px 0; }
  .step-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .step-icon { width: 15px; height: 15px; flex-shrink: 0; color: #e4e4e7; transform: translateY(2px); }
  .step-icon svg { display: block; width: 15px; height: 15px; }
  .step-tag { font-weight: 650; color: #f4f4f5; flex-shrink: 0; }
  .step-dot { color: #71717a; flex-shrink: 0; }
  .step-desc { color: #a1a1aa; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step-path { color: #93c5fd; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #3b82f6; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step-extra { color: #f87171; font-size: 11px; margin: 2px 0 0 39px; }
  .think-more { margin: 2px 0 4px 39px; }
  .think-more summary { cursor: pointer; color: #71717a; font-size: 11px; list-style: none; }
  .think-more summary::-webkit-details-marker { display: none; }
  .step-body { color: #a1a1aa; font-size: 12px; white-space: pre-wrap; margin-top: 4px; line-height: 1.55; }
  .step.reply { color: #fafafa; font-size: 15px; padding: 10px 0 8px 23px; line-height: 1.65; }
  .step.reply .md { color: #fafafa; }

  .rendered h1, .rendered h2, .rendered h3 { margin: 16px 0 8px; color: #f0f0f0; font-weight: 650; }
  .rendered h1 { font-size: 22px; }
  .rendered h2 { font-size: 18px; }
  .rendered h3 { font-size: 15px; }
  .rendered p { margin-bottom: 10px; }
  .rendered ul, .rendered ol { padding-left: 22px; margin-bottom: 10px; }
  .rendered li { margin-bottom: 4px; }
  .rendered code { background: #1a1a1a; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: 'SF Mono', monospace; }
  .rendered pre { background: #1a1a1a; padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 12px; }
  .rendered pre code { padding: 0; background: none; }
  .rendered table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  .rendered th, .rendered td { border: 1px solid #333; padding: 6px 10px; text-align: left; font-size: 13px; }
  .rendered th { background: #1a1a1a; font-weight: 600; }
  .rendered blockquote { border-left: 3px solid #333; padding-left: 12px; color: #aaa; margin: 8px 0; }

  .clear-btn { background: none; border: 1px solid #333; color: #888; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; margin-left: auto; }
  .clear-btn:hover { border-color: #555; color: #ccc; }
</style>
</head>
<body>

<div class="header">
  <h1>Mose Engine Debug</h1>
  <span class="status" id="status">Ready</span>
  <button class="clear-btn" onclick="clearAll()">Clear All</button>
</div>

<div class="main">
  <div class="panel">
    <div class="panel-header">SSE</div>
    <div class="panel-body" id="events-panel"></div>
  </div>
  <div class="panel">
    <div class="panel-header">Output</div>
    <div class="panel-body output" id="output-panel"></div>
  </div>
  <div class="panel doc">
    <div class="panel-header">Document <span class="path" id="doc-path"></span></div>
    <div class="panel-body doc rendered" id="doc-panel"></div>
  </div>
</div>

<div class="input-bar">
  <input id="msg-input" placeholder="输入消息，@agent名 调用 agent..."
         onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}" />
  <button id="send-btn" onclick="sendMsg()">Send</button>
</div>

<script>
let streaming = false;
const docs = {};
let activeDocPath = '';
const events = [];
let steps = [];
let defaultAgent = '';

const eventsPanel = document.getElementById('events-panel');
const outputPanel = document.getElementById('output-panel');
const docPanel = document.getElementById('doc-panel');
const docPathEl = document.getElementById('doc-path');
const statusEl = document.getElementById('status');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let eventsTimer = null;
function renderEvents() {
  if (eventsTimer) return;
  eventsTimer = setTimeout(() => { eventsTimer = null; doRenderEvents(); }, 80);
}
function doRenderEvents() {
  eventsPanel.innerHTML = events.map(e => {
    let cls = 'event event-system';
    if (e.type === 'user') cls = 'event event-user';
    else if (e.type === 'data') {
      try {
        const p = JSON.parse(e.raw.slice(6));
        if (p.type === 'phase') cls = 'event event-phase';
        else if (p.type === 'delta' && p.phase === 'thinking') cls = 'event event-delta-thinking';
        else if (p.type === 'delta' && p.phase === 'write') cls = 'event event-delta-write';
        else if (p.type === 'delta') cls = 'event event-delta-text';
        else if (p.type === 'done') cls = 'event event-done';
        else if (p.type === 'error') cls = 'event event-error';
      } catch {}
    } else if (e.type === 'error') cls = 'event event-error';
    return `<div class="${cls}"><span class="event-type">${escapeHtml(e.label)}</span><span class="event-content">${escapeHtml(e.raw)}</span></div>`;
  }).join('');
  eventsPanel.scrollTop = eventsPanel.scrollHeight;
}

const ICONS = {
  think: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="8" r="5.2" stroke-dasharray="2 2" opacity=".7"/><circle cx="8" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="10.5" r="1" fill="currentColor" stroke="none"/></svg>',
  read: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 2.5h6.5l3 3V13.5h-9.5z"/><path d="M10 2.5V5.5h3"/></svg>',
  glob: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4"/><path d="M10.2 10.2L13.5 13.5"/></svg>',
  write: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 12.5l.8-3.2L11.8 2l2.2 2.2-7.5 7.5z"/><path d="M3.5 12.5H13"/></svg>',
  skill: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v2M8 11.5v2M2.5 8h2M11.5 8h2"/></svg>',
  memory: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="2.5" width="9" height="11" rx="1"/><path d="M6 5.5h4M6 8h4M6 10.5h2"/></svg>',
  agent: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="6" r="2.2"/><path d="M3.5 13c.6-2.4 2.2-3.5 4.5-3.5s3.9 1.1 4.5 3.5"/></svg>',
};

const TAGS = {
  thinking: { tag: 'Think', icon: ICONS.think, path: false },
  read: { tag: 'Read', icon: ICONS.read, path: true },
  list: { tag: 'List', icon: ICONS.glob, path: true },
  write: { tag: 'Write', icon: ICONS.write, path: true },
  edit: { tag: 'Edit', icon: ICONS.write, path: true },
  skill: { tag: 'Skill', icon: ICONS.skill, path: false },
  memory: { tag: 'Memory', icon: ICONS.memory, path: true },
  agent: { tag: 'Agent', icon: ICONS.agent, path: false },
};

function lastStep() { return steps[steps.length - 1]; }

function previewText(text, n) {
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  if (!t) return '…';
  return t.length > n ? t.slice(0, n) + '…' : t;
}

function pushThinking(text) {
  const last = lastStep();
  if (last && last.kind === 'thinking') last.body += text;
  else steps.push({ kind: 'thinking', detail: '', extra: '', body: text || '' });
}

function pushAction(kind, detail, extra) {
  const last = lastStep();
  if (last && last.kind === kind && last.detail === detail) {
    if (extra) last.extra = extra;
    return;
  }
  steps.push({ kind: kind, detail: detail || '', extra: extra || '', body: '' });
}

function pushReply(text) {
  const last = lastStep();
  if (last && last.kind === 'reply') last.body += text;
  else steps.push({ kind: 'reply', detail: '', extra: '', body: text || '' });
}

let outputTimer = null;
function renderOutput() {
  if (outputTimer) return;
  outputTimer = setTimeout(() => { outputTimer = null; doRenderOutput(); }, 80);
}
function doRenderOutput() {
  if (!steps.length) {
    outputPanel.innerHTML = '<div class="doc-empty">等待回复...</div>';
    return;
  }
  outputPanel.innerHTML = steps.map((s) => {
    if (s.kind === 'reply') {
      const body = streaming ? escapeHtml(s.body) : simpleMarkdown(s.body);
      return `<div class="step reply"><div class="md">${body}</div></div>`;
    }
    const spec = TAGS[s.kind] || { tag: s.kind, icon: '', path: false };
    const desc = s.kind === 'thinking' ? previewText(s.body, 88) : (s.detail || '');
    const descCls = spec.path ? 'step-path' : 'step-desc';
    const extra = s.extra ? `<div class="step-extra">${escapeHtml(s.extra)}</div>` : '';
    const more = (s.kind === 'thinking' && s.body && s.body.length > 88)
      ? `<details class="think-more"><summary>展开思考</summary><div class="step-body">${escapeHtml(s.body)}</div></details>`
      : '';
    return `<div class="step ${s.kind}"><div class="step-row"><span class="step-icon">${spec.icon}</span><span class="step-tag">${spec.tag}</span><span class="step-dot">·</span><span class="${descCls}">${escapeHtml(desc)}</span></div>${more}${extra}</div>`;
  }).join('');
  outputPanel.scrollTop = outputPanel.scrollHeight;
}

let docTimer = null;
function renderDoc() {
  if (docTimer) return;
  docTimer = setTimeout(() => { docTimer = null; doRenderDoc(); }, 80);
}
function doRenderDoc() {
  docPathEl.textContent = activeDocPath || '';
  const md = activeDocPath ? (docs[activeDocPath] || '') : '';
  if (!md) {
    docPanel.innerHTML = '<div class="doc-empty">还没有文档。Agent write_file / edit_file 后会显示在这里。</div>';
    return;
  }
  docPanel.innerHTML = streaming
    ? `<div style="white-space:pre-wrap">${escapeHtml(md)}</div>`
    : simpleMarkdown(md);
}

function simpleMarkdown(md) {
  const normalized = String(md).replace(/\n{3,}/g, '\n\n');
  const lines = normalized.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith('|') && i + 1 < lines.length && /^\s*\|?\s*[-:| ]+\s*\|/.test(lines[i + 1] || '')) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        rows.push(lines[i]);
        i++;
      }
      const parseRow = (r) => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
      const head = parseRow(rows[0]);
      const body = rows.slice(2).map(parseRow);
      let t = '<table><thead><tr>' + head.map((c) => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>';
      for (const row of body) t += '<tr>' + row.map((c) => `<td>${inlineMd(c)}</td>`).join('') + '</tr>';
      t += '</tbody></table>';
      out.push(t);
      continue;
    }
    i++;
    if (/^### /.test(line)) out.push(`<h3>${inlineMd(line.slice(4))}</h3>`);
    else if (/^## /.test(line)) out.push(`<h2>${inlineMd(line.slice(3))}</h2>`);
    else if (/^# /.test(line)) out.push(`<h1>${inlineMd(line.slice(2))}</h1>`);
    else if (/^> /.test(line)) out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`);
    else if (/^[-*] /.test(line)) {
      const items = [line.slice(2)];
      while (i < lines.length && /^[-*] /.test(lines[i])) {
        items.push(lines[i].slice(2));
        i++;
      }
      out.push('<ul>' + items.map((x) => `<li>${inlineMd(x)}</li>`).join('') + '</ul>');
    } else if (line.trim() === '') out.push('');
    else out.push(`<p>${inlineMd(line)}</p>`);
  }
  return out.join('\n');
}

function inlineMd(s) {
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function explainNetError(msg) {
  const m = String(msg || '');
  if (/network error|failed to fetch|load failed|networkerror|connection/i.test(m)) {
    return m + ' — SSE 在完成前被断开。常见原因：Worker 超时、空闲连接被掐、或模型接口不可达。';
  }
  return m;
}

function addEvent(label, raw, type) {
  events.push({ label, raw, type: type || (label === 'USER' ? 'user' : label === 'ERROR' ? 'error' : 'data') });
  renderEvents();
}

function applyWrite(parsed) {
  const path = (parsed.meta && parsed.meta.path) || activeDocPath || '(unsaved)';
  const mode = parsed.meta && parsed.meta.mode;
  const text = parsed.text || '';
  if (parsed.type === 'phase') {
    activeDocPath = path;
    if (mode !== 'edit' && docs[path] == null) docs[path] = '';
    renderDoc();
    return;
  }
  activeDocPath = path;
  if (mode === 'edit') docs[path] = text;
  else docs[path] = (docs[path] || '') + text;
  renderDoc();
}

function applyParsed(parsed) {
  if (parsed.type === 'phase') {
    const meta = parsed.meta || {};
    const path = meta.path || meta.prefix || '';
    const err = meta.error || '';
    if (parsed.phase === 'agent_start') pushAction('agent', meta.agentName || 'agent');
    else if (parsed.phase === 'read') {
      const isList = meta.tool === 'list_files';
      pushAction(isList ? 'list' : 'read', path || '/');
    } else if (parsed.phase === 'write') {
      pushAction(meta.mode === 'edit' ? 'edit' : 'write', path, err);
      applyWrite(parsed);
    } else if (parsed.phase === 'skill') pushAction('skill', meta.name || '');
    else if (parsed.phase === 'memory') pushAction('memory', meta.path || 'memory/MEMORY.md');
    renderOutput();
    return;
  }
  if (parsed.type !== 'delta') return;
  if (parsed.phase === 'thinking') {
    pushThinking(parsed.text || '');
    renderOutput();
    return;
  }
  if (parsed.phase === 'write') {
    const path = (parsed.meta && parsed.meta.path) || activeDocPath || '(unsaved)';
    const mode = parsed.meta && parsed.meta.mode;
    pushAction(mode === 'edit' ? 'edit' : 'write', path, (parsed.meta && parsed.meta.error) || '');
    applyWrite(parsed);
    renderOutput();
    return;
  }
  if (parsed.phase === 'text') {
    pushReply(parsed.text || '');
    renderOutput();
  }
}

function clearAll() {
  if (eventsTimer) { clearTimeout(eventsTimer); eventsTimer = null; }
  if (outputTimer) { clearTimeout(outputTimer); outputTimer = null; }
  if (docTimer) { clearTimeout(docTimer); docTimer = null; }
  events.length = 0;
  steps = [];
  Object.keys(docs).forEach((k) => delete docs[k]);
  activeDocPath = '';
  eventsPanel.innerHTML = '';
  outputPanel.innerHTML = '<div class="doc-empty">等待回复...</div>';
  docPanel.innerHTML = '<div class="doc-empty">还没有文档。</div>';
  docPathEl.textContent = '';
}

async function sendMsg() {
  if (streaming) return;
  const msg = msgInput.value.trim();
  if (!msg) return;

  streaming = true;
  steps = [];
  Object.keys(docs).forEach((k) => delete docs[k]);
  activeDocPath = '';
  events.length = 0;
  let payload = msg;
  if (defaultAgent && !/@\S+/.test(payload)) payload = '@' + defaultAgent + ' ' + payload;
  msgInput.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = 'Streaming...';
  outputPanel.innerHTML = '<div class="doc-empty">等待回复...</div>';
  docPanel.innerHTML = '<div class="doc-empty">还没有文档。</div>';
  docPathEl.textContent = '';

  addEvent('USER', payload, 'user');

  const params = new URLSearchParams(window.location.search);
  const sessionId = parseInt(params.get('session') || window._sessionId || '0', 10);
  if (!sessionId) {
    addEvent('ERROR', '没有 session。请用已登录的应用地址打开本页。', 'error');
    streaming = false;
    sendBtn.disabled = false;
    statusEl.textContent = 'Error';
    return;
  }

  try {
    const res = await fetch('/api/work/chat', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message: payload }),
    });

    if (!res.ok) {
      const errText = await res.text();
      if (res.status === 401) {
        addEvent('ERROR', '未登录。请先打开 /login 登录，再回到本页刷新。', 'error');
        statusEl.textContent = '未登录 → 先去 /login';
      } else {
        addEvent('ERROR', `HTTP ${res.status}: ${errText}`, 'error');
        statusEl.textContent = `Error ${res.status}`;
      }
      streaming = false;
      sendBtn.disabled = false;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let gotDone = false;
    let gotSseError = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data || data === '[DONE]') continue;

        addEvent('SSE', line.length > 500 ? line.slice(0, 500) + '…' : line);

        try {
          const parsed = JSON.parse(data);
          if (parsed.type === 'done') gotDone = true;
          if (parsed.type === 'error') {
            gotSseError = true;
            addEvent('ERROR', explainNetError(parsed.message || 'error'), 'error');
          } else applyParsed(parsed);
        } catch {}
      }
    }
    if (!gotDone && !gotSseError) {
      addEvent('ERROR', explainNetError('network error'), 'error');
      statusEl.textContent = '连接中断';
    }
  } catch (err) {
    addEvent('ERROR', explainNetError((err && err.message) ? err.message : String(err)), 'error');
    statusEl.textContent = 'Error';
  }

  streaming = false;
  if (outputTimer) { clearTimeout(outputTimer); outputTimer = null; }
  if (docTimer) { clearTimeout(docTimer); docTimer = null; }
  doRenderOutput();
  doRenderDoc();
  if (statusEl.textContent === 'Streaming...') statusEl.textContent = 'Done';
  sendBtn.disabled = false;
}

const params = new URLSearchParams(window.location.search);
if (!params.get('session')) {
  statusEl.textContent = 'Ready — 用 ?session=N 指定会话ID';
  fetch('/api/work/sessions', { credentials: 'include' }).then(async r => {
    if (r.status === 401) {
      statusEl.innerHTML = '未登录 — <a href="/login" style="color:#60a5fa">先去登录</a>，再回到本页';
      return;
    }
    const sessions = await r.json();
    if (sessions.length > 0) {
      const latest = sessions[0];
      statusEl.textContent = `Ready — session ${latest.id}: ${latest.title?.slice(0, 30) || '新对话'}`;
      window._sessionId = latest.id;
    }
  }).catch(() => {});
}
fetch('/api/agents', { credentials: 'include' }).then(async r => {
  if (!r.ok) return;
  const agents = await r.json();
  if (Array.isArray(agents) && agents.length > 0) {
    defaultAgent = agents[0].name || '';
    if (defaultAgent && !statusEl.innerHTML.includes('未登录')) {
      statusEl.textContent = (statusEl.textContent || 'Ready') + ' · @' + defaultAgent;
    }
  }
}).catch(() => {});

clearAll();
</script>
